<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e9">
  <meta name="description" content="把可爱的小伙伴轻轻放下，看看能合成什么惊喜。">
  <title>合成小伙伴</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/matter.min.js"></script>
  <script defer src="config.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <main class="page">
      <section class="play-column" aria-label="游戏区域">
        <div class="game-card">
          <div class="game-header">
            <div class="score-group"><div><span class="stat-label">当前得分</span><strong id="score">0</strong></div><div><span class="stat-label">最高纪录</span><strong id="best">0</strong></div></div>
            <div class="next-group"><span class="stat-label">下一个</span><canvas id="next" width="88" height="88" aria-label="下一个伙伴"></canvas></div>
          </div>
          <div class="stage-wrap">
            <canvas id="game" width="420" height="570" tabindex="0" aria-label="合成游戏。鼠标或手指移动后松开放下，键盘使用左右方向键移动，空格键放下。" aria-describedby="controls-help">你的浏览器不支持游戏画布。</canvas>
          </div>
          <div class="game-footer">
            <p id="controls-help">点击或拖动放下；相同伙伴合体，堆过虚线则结束。</p>
            <div class="buttons">
              <button id="pause" class="text-button" type="button"><span aria-hidden="true">Ⅱ</span> 暂停</button>
              <button id="restart" class="text-button" type="button"><span aria-hidden="true">↻</span> 重新开始</button>
            </div>
          </div>
        </div>
      </section>
  </main>
  <dialog id="pause-dialog" aria-labelledby="pause-title">
    <h2 id="pause-title">已暂停</h2>
    <div class="dialog-actions">
      <button id="resume" class="primary-button" type="button">继续游戏</button>
      <button id="music" class="secondary-button" type="button" disabled>未设置背景音乐</button>
    </div>
  </dialog>
  <dialog id="game-over" aria-labelledby="game-over-title" aria-describedby="game-over-score">
    <div id="result-picture" class="result-picture" hidden>
      <img id="game-over-image" alt="">
      <button id="close-result-picture" class="image-close" type="button" aria-label="关闭结束图片">×</button>
    </div>
    <h2 id="game-over-title">游戏结束</h2>
    <p id="game-over-score"></p>
    <button id="play-again" class="primary-button" type="button">再玩一次 <span aria-hidden="true">↗</span></button>
  </dialog>
  <audio id="background-music" loop preload="none"></audio>
</body>
</html>
